name: Build macOS candidate
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:renderer
      - run: npm run build:server
      - run: node scripts/verify-package.mjs
      - name: Build macOS ARM64 and Intel DMGs
        shell: bash
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          node scripts/verify-package.mjs "dist/mac-arm64/OpenFOAM Studio.app/Contents/Resources/app"
          rm -rf dist/mac-arm64
          npx electron-builder --mac dmg --x64 --publish never
          node scripts/verify-package.mjs "dist/mac/OpenFOAM Studio.app/Contents/Resources/app"
          rm -rf dist/mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/postbuild.mjs
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-mac-${{ inputs.ref }}
          path: dist/releases/*
          if-no-files-found: error

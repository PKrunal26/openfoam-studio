name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'core/**'
      - 'renderer/**'
      # Bundled into the installer, so changes here must trigger a rebuild —
      # keep this list matching the electron-builder `files` globs.
      - 'wiki/**'
      - 'docs/openfoam-v13/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.win.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Bundle server
        run: npm run build:server

      - name: Build Windows installer
        run: npx electron-builder --win --config electron-builder.win.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""

      - name: Postbuild cleanup + move to releases/
        run: node scripts/postbuild.mjs

      - name: Delete old windows-latest release
        shell: bash
        run: gh release delete windows-latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows (latest build)
          body: |
            Built from commit ${{ github.sha }} on ${{ github.ref_name }}
          files: dist/releases/*.exe
          fail_on_unmatched_files: true
          make_latest: true

name: Build Windows candidate
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:renderer
      - run: npm run build:server
      - run: node scripts/verify-package.mjs
      - name: Build Windows x64 installer
        run: npx electron-builder --win --config electron-builder.win.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/verify-package.mjs "dist/win-unpacked/resources/app"
      - run: node scripts/postbuild.mjs
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-windows-${{ inputs.ref }}
          path: dist/releases/*
          if-no-files-found: error
